<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android UI Inspector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-row">
      <div class="product-mark">
        <span class="mark-glyph" aria-hidden="true">UI</span>
        <h1>Android UI Inspector</h1>
        <p id="connection-status"><span class="status-dot"></span>等待设备</p>
      </div>
    </div>
    <div class="topbar-actions">
      <label class="field compact">
        <span>设备</span>
        <select id="device-select" aria-label="Android 设备"><option value="">选择设备</option></select>
      </label>
      <label class="field compact">
        <span>范围</span>
        <select id="scope-select" aria-label="采集范围">
          <option value="process" selected>按进程</option><option value="window">按 Window</option><option value="activity">按 Activity/Fragment</option>
        </select>
      </label>
      <button id="scope-filter-toggle" type="button" class="ghost-button scope-toggle" hidden>选择内容…</button>
      <select id="process-select" hidden><option value="">选择进程</option></select>
      <button id="capture-button" class="primary-button">采集</button>
      <button id="jvmti-diag-button" type="button" class="ghost-button">检测 JVMTI</button>
    </div>
  </header>
  <section id="catalog-panel" class="catalog-panel popup-panel" hidden>
    <div class="popup-title">
      <span id="filter-label" class="catalog-label">进程</span>
      <label class="all-check"><input id="filter-all" type="checkbox" checked>全部</label>
    </div>
    <input id="filter-search" type="search" placeholder="搜索/模糊匹配" autocomplete="off">
    <div id="filter-list" class="filter-list" role="listbox" aria-label="分类筛选列表"></div>
    <select id="filter-select" multiple hidden aria-label="分类筛选（数据源）"></select>
  </section>

  <div id="jvmti-diag-panel" class="jvmti-diag-panel" hidden></div>
  <main class="workspace">
    <button id="tree-edge-toggle" type="button" class="edge-toggle tree-edge" aria-label="展开左侧树" title="展开左侧树">›</button>
    <button id="property-edge-toggle" type="button" class="edge-toggle property-edge" aria-label="展开右侧属性" title="展开右侧属性">‹</button>
    <aside class="tree-panel panel">
      <div class="panel-heading">
        <div><span class="kicker">结构</span><h2>Window / View 树</h2></div>
        <span class="heading-right">
          <span id="tree-count" class="count-chip">0</span>
          <button id="tree-toggle" type="button" class="collapse-button" aria-label="收起/展开左侧树" title="收起/展开">‹</button>
        </span>
      </div>
      <label class="search-field">
        <span class="sr-only">搜索 View</span>
        <input id="tree-search" type="search" placeholder="搜索 class、id、text">
      </label>
      <div id="tree" class="tree" role="tree" aria-label="Window 和 View 层级"></div>
      <div id="tree-resize-handle" class="resize-handle" aria-hidden="true"></div>
    </aside>

    <section class="stage-panel">
      <div class="stage-toolbar">
        <div class="segmented" aria-label="视图形式">
          <button data-stage="2d" aria-pressed="true">2D</button>
          <button data-stage="3d" aria-pressed="false">3D</button>
        </div>
        <div id="three-mode" class="segmented" aria-label="3D 层级含义">
          <button data-three-mode="windows" aria-pressed="true">Window layers</button>
          <button data-three-mode="views" aria-pressed="false">View depth</button>
        </div>
        <label class="inline-field">
          <span>Display</span>
          <select id="display-select"><option value="0">0</option></select>
        </label>
        <label class="depth-control">
          <span id="depth-label">全部层</span>
          <input id="depth-slider" type="range" min="0" max="0" value="0">
        </label>
        <label class="rule-toggle">
          <input id="rules-toggle" type="checkbox">
          <span>异常检查</span>
        </label>
        <button id="reset-stage-button" type="button" class="ghost-button stage-reset" title="重置视图比例与位置">重置视图</button>
      </div>

      <div id="stage" class="stage" tabindex="0" aria-label="UI 层级画布">
        <div id="empty-state" class="empty-state">
          <span class="empty-glyph">⌁</span>
          <h2>选择设备并采集</h2>
          <p>目标进程优先读取真实 View；无法增强时自动显示公开语义节点。</p>
        </div>
        <div id="two-d-stage" class="two-d-stage" hidden>
          <div id="screen-frame" class="screen-frame">
            <img id="screenshot" alt="设备截图">
            <div id="overlay-layer" class="overlay-layer"></div>
            <div id="secure-screenshot" class="secure-screenshot" hidden></div>
          </div>
        </div>
        <div id="three-d-stage" class="three-d-stage" hidden>
          <div id="scene" class="scene"></div>
        </div>
      </div>
      <footer class="stage-footer">
        <span id="stage-caption">尚未采集</span>
        <span id="fidelity-badge" class="source-chip">—</span>
      </footer>
    </section>

    <aside id="property-panel" class="property-panel panel">
      <div class="panel-heading">
        <div><span class="kicker">详情</span><h2 id="selected-title">属性</h2></div>
        <span class="heading-right">
          <span id="selected-source" class="source-chip">未选择</span>
          <button id="property-toggle" type="button" class="collapse-button" aria-label="收起/展开右侧属性" title="收起/展开">›</button>
        </span>
      </div>
      <section id="findings" class="findings" hidden>
        <div class="subheading"><h3>异常候选</h3><span id="finding-count" class="warning-chip">0</span></div>
        <div id="finding-list"></div>
      </section>
      <section id="accessibility-audit" class="accessibility-audit" hidden>
        <div class="subheading">
          <h3>无障碍审计</h3>
          <span id="accessibility-audit-count" class="warning-chip" title="配置缺失数量">0</span>
        </div>
        <div class="audit-filters" aria-label="无障碍审计分类">
          <button type="button" data-accessibility-filter="enabled" aria-pressed="false">已启用 <span>0</span></button>
          <button type="button" data-accessibility-filter="disabled" aria-pressed="false">已禁用 <span>0</span></button>
          <button type="button" data-accessibility-filter="issues" aria-pressed="true">配置缺失 <span>0</span></button>
        </div>
        <div id="accessibility-audit-list" class="accessibility-audit-list"></div>
      </section>
      <div id="properties" class="properties">
        <div class="property-empty">从左侧树、2D 框或 3D 平面选择一个节点。</div>
      </div>
      <section class="diagnostics">
        <div class="subheading"><h3>采集诊断</h3></div>
        <div id="diagnostic-list" class="diagnostic-list"><p>暂无数据</p></div>
      </section>
      <div id="property-resize-handle" class="resize-handle property-resize-handle" aria-hidden="true"></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
